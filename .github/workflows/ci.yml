name: CI (Lint & Test)

# PR — проверка до мержа; push в develop — проверка того, что реально влито (после неё идёт деплой,
# см. deploy.yml); вручную — перепроверить ветку.
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

# Новый пуш в тот же PR отменяет устаревшую проверку; проверки develop не отменяются — по ним деплой.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — Ruff и Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gorky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gorky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          working-directory: backend

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Run Ruff (Linter)
        run: uv run --locked ruff check .

      - name: Run Pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gorky_test
        run: uv run --locked pytest -rs

  frontend:
    name: Frontend — Vitest и сборка
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Та же версия Node, что в frontend/Dockerfile
      - name: Install Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Run Vitest
        run: npm test

      # tsc -b + vite build — та же команда, что собирает образ на сервере
      - name: Build
        run: npm run build

  images:
    name: Docker — сборка образов
    runs-on: ubuntu-latest

    # Образы стенда собираются здесь, а не на сервере: на его диске 10 ГБ сборка бэкенда с torch
    # не помещается. В PR — только проверка сборки; на push в develop образы публикуются в GHCR
    # с тегом-коммитом, и deploy.yml выкатывает ровно их (выкатываются только после зелёного CI).
    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

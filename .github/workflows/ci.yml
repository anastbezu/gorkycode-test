name: CI (Lint & Test)

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gorky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gorky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          working-directory: backend

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Run Ruff (Linter)
        run: uv run --locked ruff check .

      - name: Run Pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gorky_test
        run: uv run --locked pytest -rs

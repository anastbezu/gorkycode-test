name: CD (Deploy to VPS)

# Деплой — только после зелёного CI на develop: сломанная сборка или тесты до сервера не доходят.
# На сервер выкатывается ровно тот коммит, который проверил CI. Вручную — текущий develop
# (например, после правки .env на сервере).
on:
  workflow_run:
    workflows:
      - CI (Lint & Test)
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

# Деплои стенда идут строго по одному: следующий ждёт окончания текущего, не прерывая его.
concurrency:
  group: deploy-gorky-bond
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    # Токен задачи даёт серверу скачать образы из GHCR и истекает с её окончанием.
    permissions:
      packages: read

    steps:
      - name: Deploy application on VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ghcr.io/${{ github.repository }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_SHA,REGISTRY_USER,REGISTRY_TOKEN,IMAGES
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/gorkycode
            git fetch origin develop
            # Проверенный CI коммит; если develop уже ушёл дальше, следующий деплой придёт со своим CI.
            git merge --ff-only "$DEPLOY_SHA"
            echo "Выкатываю $(git rev-parse --short HEAD)"

            # На сервере образы не собираются (диск 10 ГБ): CI опубликовал их с тегом-коммитом.
            # Скачанный образ получает тег latest — его берёт docker-compose.yaml, так что
            # ручной `docker compose up -d` на сервере поднимает выкаченную версию.
            # Неиспользуемые образы удаляются при любом исходе, в том числе при падении.
            cleanup() {
              docker logout ghcr.io >/dev/null || true
              docker image prune -af || true
              df -h /
            }
            trap cleanup EXIT
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            for service in backend frontend; do
              docker pull "$IMAGES/$service:$DEPLOY_SHA"
              docker tag "$IMAGES/$service:$DEPLOY_SHA" "$IMAGES/$service:latest"
            done
            docker compose up -d --no-build --remove-orphans

            # Стенд считается обновлённым, только когда бэкенд ответил на /health
            # (миграции применяются при старте контейнера) и nginx отдаёт страницу.
            ok=""
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8000/health && curl -fs -o /dev/null http://127.0.0.1:3000/; then
                ok=1; echo; break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              # Логи сервисов сюда не выводим: логи Actions в публичном репозитории видны всем.
              docker compose ps
              echo "Бэкенд (/health) или фронтенд (/) не ответили за 60 с. Логи: docker compose logs на сервере." >&2
              exit 1
            fi

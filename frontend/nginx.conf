server {
    listen 80;
    root /usr/share/nginx/html;

    # Файлы сборки с хешем в имени не меняются — кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшировать, чтобы после деплоя браузер взял новую сборку
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

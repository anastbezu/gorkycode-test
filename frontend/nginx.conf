server {
    listen 80;
    root /usr/share/nginx/html;

    # API — в контейнер бэкенда: локально `docker compose up` даёт рабочую страницу на :3000.
    # На стенде /api до этого контейнера не доходит — его направляет Nginx сервера (docs/infra.md).
    location /api/ {
        client_max_body_size 5m;  # аудио в /api/stt — до 30 секунд речи
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;  # ответ модели
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки с хешем в имени не меняются — кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшировать, чтобы после деплоя браузер взял новую сборку
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackathon_postgres
    restart: always
    environment:
      # Значений по умолчанию нет: без .env compose остановится с ошибкой.
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
    ports:
      # Только loopback: локально — для тестов и uv run, на сервере снаружи недоступно.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Стенд берёт готовый образ из GHCR (deploy.yml), локально образ собирается из build.
    image: ghcr.io/anastbezu/gorkycode-test/backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # Внутри Docker база — сервис postgres. DATABASE_URL из .env — для запуска с хоста.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_THINKING_LEVEL: ${STT_THINKING_LEVEL:-}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/anastbezu/gorkycode-test/frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:

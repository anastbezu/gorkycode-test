[project]
name = "gorky-backend"
version = "0.1.0"
description = "Голосовой ассистент для задач и встреч — бэкенд"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    # Поиск (search-01): модель эмбеддингов, основы слов, нечёткое сравнение слов,
    # словарные формы слов (падежи имён: «Сергею» ↔ «Сергеем»).
    "sentence-transformers>=5.0.0",
    "torch>=2.8.0",
    "snowballstemmer>=3.0.0",
    "rapidfuzz>=3.9.0",
    "pymorphy3>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
eval = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

# torch — только CPU-сборка: torch с PyPI под Linux тянет пакеты CUDA на гигабайты,
# а видеокарты на сервере нет.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: живой прогон через настоящую LLM (agent-08), включается AGENT_LIVE=1",
    "search_model: настоящая модель поиска вместо подмены из conftest (нужны её файлы)",
]
